# 매치로그(선수 이동 경로)를 만든다.
#
# **왜 따로 두나**: 대회 수집 워크플로는 집계 결과만 커밋하고 경기 원본을 버린다.
# 그런데 매치로그는 원본 안의 텔레메트리 URL 이 있어야 만들 수 있어서, 이미 집계가
# 끝난 대회는 원본을 다시 받아야 한다. 그래서 -SkipBuilt 없이 대상 단계만 받는다.
#
# **왜 서버에서 하나**: 텔레메트리가 경기당 33MB 다. 25단계 370경기면 약 12GB 를
# 내려받는데, 뽑고 나면 경기당 300KB 만 남는다(합쳐서 약 75MB). 내려받기는 서버가
# 하고 결과만 커밋하면 집에서 12GB 를 받을 일이 없다.
#
# 기본 대상은 글로벌 4종(PGC·PGS·PNC·EWC)의 **결승 단계**다. 예선 경기의 선수
# 동선을 들여다볼 일은 거의 없고, 전 단계로 넓히면 155GB 가 된다.

name: 매치로그 수집

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: '받기에 쓸 시간 한도(분). GitHub 작업 한도는 6시간'
        required: false
        default: '240'
      delay_seconds:
        description: 'API 호출 간격(초). 분당 10회 제한이라 6초 미만으로 줄이지 말 것'
        required: false
        default: '6'
      force:
        description: '이미 만든 매치로그도 다시 뽑는다 (추출 규칙을 고쳤을 때)'
        required: false
        type: boolean
        default: false
      scope:
        description: '대상 범위'
        required: false
        type: choice
        options: ['글로벌 결승만', '전 단계']
        default: '글로벌 결승만'

permissions:
  contents: write

concurrency:
  group: collect-matchlogs
  cancel-in-progress: false

jobs:
  matchlogs:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 대상과 비용 확인
        run: python ingest/build_match_logs_all.py --list

      # **받기와 뽑기를 한 단계씩 번갈아 하고, 열 단계마다 커밋·푸시한다.**
      #
      # 예전에는 전부 받아 전부 뽑고 **마지막에 한 번** 커밋했다. 그 마지막
      # 한 걸음이 세 번 다른 이유로 실패했고 그때마다 4~5시간치가 통째로
      # 날아갔다 (집계 거부 / 작업 한도 초과 / 리베이스 거부). 중간에 저장하면
      # 무엇이 터지든 잃는 것이 마지막 열 단계로 묶인다.
      #
      # 원본은 뽑고 나면 지운다. 러너 디스크가 14GB 뿐인데 경기당 33MB 다.
      - name: 원본 받아서 바로 매치로그 뽑기
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          SCOPE: ${{ github.event.inputs.scope }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 지금까지 만든 것을 저장한다. 어떤 이유로 실패해도 **작업을 죽이지
          # 않는다** — 다음 묶음에서 다시 시도하면 되고, 여기서 죽으면 그게
          # 바로 전부를 잃는 그 한 걸음이 된다.
          save() {
            set +e
            # primary_data 전체를 담는다. 매치로그만 담았다가 경기 순서·날짜가
            # 바뀐 primary_data/tournaments 가 남아 리베이스가 거부됐다.
            git add -A primary_data
            if git diff --cached --quiet; then
              echo "::notice::저장할 새 결과가 없습니다."
              set -e; return 0
            fi
            n=$(git diff --cached --name-only | wc -l)
            git commit -q               -m "data: 매치로그 $n 파일 추출 (자동 수집)"               -m "텔레메트리에서 이동 경로·자기장·킬 지점만 뽑았다. 원본 33MB/경기는 버린다."               -m "남은 대회는 다음 실행이 이어서 받는다 - 커밋된 로그가 진행 표시다."
            for i in 1 2 3; do
              git fetch -q origin main
              # 리베이스가 깨지면 되돌리고 다음 시도로 넘어간다. --abort 가
              # 실패해도(진행 중인 리베이스가 없을 때) 무시한다.
              git rebase -X theirs origin/main || git rebase --abort || true
              if git push -q origin HEAD:main; then
                echo "::notice::$n 파일 저장 (시도 $i)"
                set -e; return 0
              fi
              sleep 5
            done
            echo "::warning::푸시를 세 번 다 실패했습니다. 다음 묶음에서 다시 시도합니다."
            set -e; return 0
          }

          python - <<'PY' > /tmp/targets.txt
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location(
              "m", "ingest/build_match_logs_all.py")
          m = importlib.util.module_from_spec(spec)
          sys.argv = ["x"]
          spec.loader.exec_module(m)
          class A:
              list=True; all_global=False; series=None
              all = __import__("os").environ.get("SCOPE") == "전 단계"
          for date, series, tid, n, have in m.targets(A()):
              print(tid)
          PY
          echo "대상 $(wc -l < /tmp/targets.txt) 단계"

          BUDGET=$(( ${{ github.event.inputs.max_minutes || 240 }} * 60 ))
          FORCE="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          START=$(date +%s); N=0; OK=0
          while read -r tid; do
            [ -z "$tid" ] && continue
            if [ $(( $(date +%s) - START )) -ge "$BUDGET" ]; then
              echo "시간 예산을 다 썼습니다. $N 단계까지 하고 멈춥니다."
              echo "남은 단계는 한 번 더 실행하면 이어서 합니다."
              break
            fi
            # 이미 만들어 둔 단계는 --force 가 아니면 건너뛴다. 받는 데만
            # 몇 분씩 드는데 결과가 같다.
            if [ -z "$FORCE" ] && [ -d "primary_data/matchlogs/$tid" ]; then
              continue
            fi
            N=$(( N + 1 ))
            echo "::group::[$N] $tid"
            pwsh -NoProfile -File ingest/fetch_tournament.ps1               -TournamentId "$tid"               -DelaySeconds ${{ github.event.inputs.delay_seconds || 6 }} || true
            if python ingest/build_match_log.py "$tid" $FORCE; then
              OK=$(( OK + 1 ))
            fi
            python ingest/build_match_order.py "$tid" || true
            rm -rf "intermediate_results/tournaments/$tid"
            echo "::endgroup::"
            if [ $(( N % 10 )) -eq 0 ]; then save; fi
          done < /tmp/targets.txt

          save
          echo "시도 $N 단계 · 성공 $OK · 경과 $(( ($(date +%s) - START) / 60 ))분"

      - name: 진행 상황
        if: always()
        run: |
          n=$(find primary_data/matchlogs -name '*.json' 2>/dev/null | wc -l)
          d=$(find primary_data/matchlogs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          echo "### 매치로그: $d 개 대회 · $n 경기" >> $GITHUB_STEP_SUMMARY
