# 매치로그(선수 이동 경로)를 만든다.
#
# **왜 따로 두나**: 대회 수집 워크플로는 집계 결과만 커밋하고 경기 원본을 버린다.
# 그런데 매치로그는 원본 안의 텔레메트리 URL 이 있어야 만들 수 있어서, 이미 집계가
# 끝난 대회는 원본을 다시 받아야 한다. 그래서 -SkipBuilt 없이 대상 단계만 받는다.
#
# **왜 서버에서 하나**: 텔레메트리가 경기당 33MB 다. 25단계 370경기면 약 12GB 를
# 내려받는데, 뽑고 나면 경기당 300KB 만 남는다(합쳐서 약 75MB). 내려받기는 서버가
# 하고 결과만 커밋하면 집에서 12GB 를 받을 일이 없다.
#
# 기본 대상은 글로벌 4종(PGC·PGS·PNC·EWC)의 **결승 단계**다. 예선 경기의 선수
# 동선을 들여다볼 일은 거의 없고, 전 단계로 넓히면 155GB 가 된다.

name: 매치로그 수집

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: '받기에 쓸 시간 한도(분). GitHub 작업 한도는 6시간'
        required: false
        default: '240'
      delay_seconds:
        description: 'API 호출 간격(초). 분당 10회 제한이라 6초 미만으로 줄이지 말 것'
        required: false
        default: '6'
      force:
        description: '이미 만든 매치로그도 다시 뽑는다 (추출 규칙을 고쳤을 때)'
        required: false
        type: boolean
        default: false
      scope:
        description: '대상 범위'
        required: false
        type: choice
        options: ['글로벌 결승만', '전 단계']
        default: '글로벌 결승만'

permissions:
  contents: write

concurrency:
  group: collect-matchlogs
  cancel-in-progress: false

jobs:
  matchlogs:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 대상과 비용 확인
        run: python ingest/build_match_logs_all.py --list

      # **받기와 뽑기를 한 단계씩 번갈아 한다.** 예전에는 전부 받은 뒤에 전부
      # 뽑았는데, 받기가 예산을 다 쓰면 뽑기가 작업 한도에 걸려 취소되고
      # 받아 둔 원본이 통째로 버려졌다 (2026-10-12, 5시간 30분 중 185경기만
      # 남았다). 한 단계씩 끝내면 예산이 끝나는 순간까지의 결과가 온전하다.
      #
      # 원본은 뽑고 나면 지운다. 러너 디스크가 14GB 뿐인데 경기당 33MB 다.
      - name: 원본 받아서 바로 매치로그 뽑기
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          SCOPE: ${{ github.event.inputs.scope }}
        run: |
          python - <<'PY' > /tmp/targets.txt
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location(
              "m", "ingest/build_match_logs_all.py")
          m = importlib.util.module_from_spec(spec)
          sys.argv = ["x"]
          spec.loader.exec_module(m)
          class A:
              list=True; all_global=False; series=None
              all = __import__("os").environ.get("SCOPE") == "전 단계"
          for date, series, tid, n, have in m.targets(A()):
              print(tid)
          PY
          echo "대상 $(wc -l < /tmp/targets.txt) 단계"

          BUDGET=$(( ${{ github.event.inputs.max_minutes || 240 }} * 60 ))
          FORCE="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          START=$(date +%s); N=0; OK=0
          while read -r tid; do
            [ -z "$tid" ] && continue
            if [ $(( $(date +%s) - START )) -ge "$BUDGET" ]; then
              echo "시간 예산을 다 썼습니다. $N 단계까지 하고 멈춥니다."
              echo "남은 단계는 한 번 더 실행하면 이어서 합니다."
              break
            fi
            # 이미 만들어 둔 단계는 --force 가 아니면 건너뛴다. 받는 데만
            # 몇 분씩 드는데 결과가 같다.
            if [ -z "$FORCE" ] && [ -d "primary_data/matchlogs/$tid" ]; then
              continue
            fi
            N=$(( N + 1 ))
            echo "::group::[$N] $tid"
            pwsh -NoProfile -File ingest/fetch_tournament.ps1               -TournamentId "$tid"               -DelaySeconds ${{ github.event.inputs.delay_seconds || 6 }} || true
            if python ingest/build_match_log.py "$tid" $FORCE; then
              OK=$(( OK + 1 ))
            fi
            python ingest/build_match_order.py "$tid" || true
            rm -rf "intermediate_results/tournaments/$tid"
            echo "::endgroup::"
          done < /tmp/targets.txt
          echo "시도 $N 단계 · 성공 $OK · 경과 $(( ($(date +%s) - START) / 60 ))분"

      # 경기 순서는 원본의 createdAt 에만 있다. 원본은 이 작업이 끝나면 사라지니
      # 여기서 적어 둔다 - 안 그러면 화면의 "1경기" 가 UUID 순이 되어 거짓이 된다.
      - name: 경기 순서·날짜 다시 맞추기
        continue-on-error: true
        run: python ingest/build_match_order.py

      # 받기에 몇 시간이 드는데 뒤 단계 하나가 실패해 전부 잃으면 안 된다.
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add primary_data/matchlogs
          if git diff --cached --quiet; then
            echo "새로 만든 매치로그가 없습니다."
            exit 0
          fi
          n=$(git diff --cached --name-only | wc -l)
          git commit \
            -m "data: 매치로그 $n 경기 추출 (자동 수집)" \
            -m "텔레메트리에서 이동 경로·자기장·킬 지점만 뽑았다. 원본 33MB/경기는 버린다." \
            -m "남은 대회는 다음 실행이 이어서 받는다 - 커밋된 로그가 진행 표시다."
          # 푸시가 막히면 러너에만 남고 데이터가 날아간다. 받기에 50분이 드는
          # 작업이라 그걸 되풀이할 수 없다. 세 번까지 다시 시도하고, 리베이스
          # 충돌이 나면 **이번에 뽑은 쪽을 택한다** — --force 로 다시 뽑은 값이
          # 최신이기 때문이다. (-X theirs 는 리베이스 중에는 "지금 얹는 커밋",
          # 즉 러너가 방금 만든 쪽을 뜻한다.)
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; true; }
            if git push origin HEAD:main; then
              echo "푸시 완료 (시도 $i)"
              exit 0
            fi
            echo "푸시 실패, 다시 시도합니다 ($i/3)"
            sleep 5
          done
          echo "세 번 모두 실패했습니다. 러너의 커밋을 패치로 남깁니다."
          git format-patch -1 --stdout > /tmp/matchlogs.patch
          exit 1

      - name: 진행 상황
        if: always()
        run: |
          n=$(find primary_data/matchlogs -name '*.json' 2>/dev/null | wc -l)
          d=$(find primary_data/matchlogs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          echo "### 매치로그: $d 개 대회 · $n 경기" >> $GITHUB_STEP_SUMMARY
