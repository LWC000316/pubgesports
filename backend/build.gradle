plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.pubg'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Flyway - 스키마를 마이그레이션으로 관리한다. ddl-auto: create 를 대체한다.
    // Spring Boot 3.2 가 Flyway 9.x 를 관리한다. PostgreSQL 지원이 core 에 들어 있어
    // 별도 flyway-database-postgresql (Flyway 10+ 에서 분리) 은 붙이지 않는다.
    implementation 'org.flywaydb:flyway-core'
    
    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'
    
    // H2 Database (개발 및 로컬 테스트용 인메모리 대체 지원)
    runtimeOnly 'com.h2database:h2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
