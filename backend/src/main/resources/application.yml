spring:
  application:
    name: pubg-esports-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pubg_esports}
    username: ${DB_USERNAME:pubg_user}
    password: ${DB_PASSWORD:pubg_password123!}
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway 가 관리한다 (db/migration). Hibernate 는 검증만 한다.
  # 예전에는 ddl-auto: create 라 기동마다 DB 가 전멸했다 — 조회수처럼 런타임에
  # 쌓이는 값을 담을 수 없었고, 수동으로 넣은 행도 재시작하면 사라졌다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  seed:
    # auto   - teams 테이블이 비어 있을 때만 시드를 적재한다 (기본)
    # always - 기동마다 팀·선수를 지우고 다시 적재한다. 시드 파일을 고친 뒤 한 번 쓴다
    # never  - 적재하지 않는다
    mode: ${SEED_MODE:auto}

pubg:
  api:
    base-url: https://api.pubg.com
    # 환경변수 PUBG_API_KEY 로 주입한다. 값을 이 파일에 다시 적지 말 것 — git 에 추적되는 파일이다.
    key: ${PUBG_API_KEY:}
    allowed-tiers:
      - PWS
      - PCL
      - PGS
      - PGC
      - PNC
      - EWC


logging:
  level:
    com.pubg.esports: DEBUG

