spring:
  application:
    name: pubg-esports-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pubg_esports}
    username: ${DB_USERNAME:pubg_user}
    password: ${DB_PASSWORD:pubg_password123!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

pubg:
  api:
    base-url: https://api.pubg.com
    # 환경변수 PUBG_API_KEY 로 주입한다. 값을 이 파일에 다시 적지 말 것 — git 에 추적되는 파일이다.
    key: ${PUBG_API_KEY:}
    allowed-tiers:
      - PWS
      - PCL
      - PGS
      - PGC
      - PNC
      - EWC


logging:
  level:
    com.pubg.esports: DEBUG

