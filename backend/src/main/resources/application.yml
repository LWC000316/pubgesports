spring:
  application:
    name: pubg-esports-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pubg_esports
    username: pubg_user
    password: pubg_password123!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    com.pubg.esports: DEBUG
